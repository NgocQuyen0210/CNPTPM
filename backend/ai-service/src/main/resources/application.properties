# HTTP Port
quarkus.http.port=9005

# MicroProfile REST Client Configuration for calling Product Service
product-service-api/mp-rest/url=http://localhost:9002

# Gemini API Configuration (Leave blank to use the fallback Java smart recommendation algorithm)
# Can be overridden by setting GEMINI_API_KEY environment variable
gemini.api.key=${GEMINI_API_KEY:none}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,User-ID
quarkus.http.cors.access-control-max-age=PT24H
