# Database Configuration for Product Service
quarkus.datasource.db-kind=mysql
quarkus.http.port=9002
quarkus.datasource.username=root
quarkus.datasource.password=Quyen@2005
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/product_db
quarkus.datasource.jdbc.initial-size=8
quarkus.datasource.jdbc.min-size=8
quarkus.datasource.jdbc.max-size=30
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

# JWT Configuration (for verifying incoming tokens)
mp.jwt.verify.issuer=https://ecommerce.phong.com/issuer
mp.jwt.verify.publickey.location=classpath:publicKey.pem

# MicroProfile REST Client Configurations
auth-service-api/mp-rest/url=http://localhost:9001

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,User-ID
quarkus.http.cors.access-control-max-age=PT24H

