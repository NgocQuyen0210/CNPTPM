# API Gateway Configuration
quarkus.http.port=9000

# Downstream Services
gateway.auth-service-url=http://localhost:9001
gateway.product-service-url=http://localhost:9002
gateway.order-service-url=http://localhost:9003
gateway.payment-service-url=http://localhost:9004
gateway.ai-service-url=http://localhost:9005

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,User-ID
quarkus.http.cors.access-control-max-age=PT24H
